<!DOCTYPE html>
<!--
[온라인 피구] 3D 3인칭 피구. 단일 HTML 파일, 모바일(터치) 우선.
외부 스크립트는 three.js r128(cdnjs)과 PeerJS 1.5.4(jsdelivr) 둘뿐이고, 버전을 고정해서 불러옴.

■ 규칙
- 팀 인원 N명(2~5) 대 N명. 시작은 점프볼: 3초 카운트다운 후 공이 올라가고, 꼭대기 근처에서 점프 버튼을 누를수록 높이 뜀. 더 높이 뛴 쪽이 공을 쳐서 팀원에게 보냄.
- 공은 하나. 가진 사람은 던지기(가장 가까운 적 자동 조준, 이동 예측 포함)나 패스(팀원에게 유도 비행)를 함.
- 던진 공에 맞으면 아웃되어 상대 코트의 뒤와 옆(외야)으로 이동.
- 잡기 버튼: 0.45초 동안 잡기 상태(쿨다운 3초, 버튼에 남은 시간 표시). 이때 던진 공에 맞으면 공만 받고 던진 사람은 그대로. 상대 패스가 근처를 지나가도 가로챔. AI도 던진 공은 20%, 패스는 25% 확률로 받아냄.
- 코트 밖으로 나간 공은 바닥을 굴러감(마찰, 바깥 벽에서 튕김). 나간 쪽 외야가 주워 감. 그쪽 외야가 한 명도 없으면 그 코트의 내야가 가져감.
- 상대 팀 전원 아웃이면 승리, 우리 팀 전원 아웃이면 패배.

■ 좌표/데이터
- 코트: x -6~6, z -10~10, 중앙선 z=0. 팀0(파랑, 우리 팀)은 z>0, 팀1(빨강)은 z<0. 외야는 상대 코트의 뒤(|z|>10)와 옆(|x|>6) 띠(clampOut).
- T = 모든 캐릭터 배열. 인덱스 0..N-1 = 팀0(0번은 방장/내 캐릭터 P, 나머지는 AI 또는 친구), N..2N-1 = 팀1. 점프볼 대표는 J.bj(팀0 사람들이 다시하기마다 돌아가며)와 J.rj(팀1에 사람이 있으면 돌아가며, 없으면 AI T[N+(N>>1)]).
- 캐릭터 필드: m(3D 그룹), team, out, pl(사람이 조종하는지), cw/cc(잡기 창/쿨다운), rx/rz(원격 입력), seen(마지막 입력 시각), mk(이름표와 모자).
- B = 공 상태. B.st: held(들고 있음, B.h) / fly(B.kind: t=던짐, p=패스) / loose(굴러감, B.rv) / jump(점프볼 중). 공 메시는 bm.
- J = 점프볼 상태(카운트다운 cd, 경과 t, 누른 시각 tb/tr, 결과 문구 res).
- 카메라: yaw(오른쪽 화면 드래그 또는 ←/→ 키로 회전), zoom(확대/축소: ＋/－ 버튼은 CSS로 숨김, 오른쪽 화면 핀치, 마우스 휠, +/- 키), wide(넓은 시점, 버튼을 없애서 항상 0). 이동 입력은 카메라 기준(inp()).

■ 멀티플레이(방장 권한 방식)
- 방장 기기가 시뮬레이션을 전부 계산. 친구는 입력만 보내고 상태를 받아 그림. 친구는 방장 팀의 AI 자리(인덱스 1..N-1) 또는 상대 팀 자리(N..2N-1)를 골라 맡음(참가 시 metadata.team). 상대 팀 점프볼 대표도 사람이 될 수 있음.
- PeerJS 무료 공개 서버로 방 코드(피어 ID는 pgdodge-코드)를 찾은 뒤 WebRTC로 직접 연결(serialization json).
- 방장 to 친구: assign{slot}, full, st{g(게임 번호), s(인원), nm(닉네임 맵), j(최고 높이 표시), n(카운트다운), e(종료 0/1/2), t[[x,z,out,y,잡기중]...], b[공상태코드, 들고있는사람, x,y,z]} 약 14Hz.
- 친구 to 방장: in{x,z}(10Hz, 세계 좌표 이동 벡터), act{a: t(던지기/점프) 또는 p(패스) 또는 c(잡기)}, nick{n}.
- 친구 화면은 시뮬레이션 없이 보간만 함(glerp). 4초 동안 입력이 없으면 그 자리는 AI로 복귀.

■ 코드 지도(위에서 아래로)
렌더러/씬 → 캐릭터/공 → 게임 로직(give, drop, shoot, pass, out, reset) → 입력(doThrow/doPass/doCatch, 조이스틱, 카메라 드래그) → 점프볼(startJump, jumpStep) → 네트워크(bcast, netApply, glerp, hostMsg, hostWatch, hs/js.onclick) → end/ui/loop(매 프레임 시뮬레이션과 카메라) → 로비 UI 생성 → 이름표(mark), 최고 높이 표시(apx).

■ 추가된 것
- 조이스틱: #pad를 누른 자리에 #jb(바닥)/#jk(손잡이)가 뜸. 손을 떼면 왼쪽 아래 기본 위치로 복귀.
- 가로모드: CSS orientation:landscape 배치 + 로비의 "가로 모드" 버튼(전체화면+방향 잠금, 미지원 기기는 안내만).
- 패스: 공을 들면 #pcs에 팀원 원이 뜸(파랑=내야, 주황=외야, 바라보는 방향 기준 왼쪽→오른쪽). 시선에 가장 가까운 팀원이 하얀 링으로 강조되고 패스 버튼/E는 그 사람에게, 원을 누르면 그 사람에게 패스. 친구는 act{a:p, i:대상 인덱스}로 보냄.
- 외야 AI 길찾기: way()가 코트 안쪽(통과 불가 구역)을 모서리 경유로 돌아가서 clampOut에 막혀 멈추던 버그 수정.

- 조준 던지기: 자동 조준 없음. 던지기는 카메라가 보는 방향(lookA)으로 직선 발사(shootDir). 공을 들면 #ag(빨간 조준선)가 바닥에 표시됨. 친구는 act{a:t,y:시선각}으로 보냄.
- 로비로 돌아가기(#lob): 멀티(방장/친구) 종료 화면과 연결 끊김 화면에 표시. 방을 닫거나 나가고 새로고침.
- 점프볼: 점프 높이 = 누른 순간 공 높이까지(공 높이-1.7). 더 높은 쪽이 승리, 안 누르면 패배.

- 감정표현: #em 버튼 → #emp 패널(EM 목록). 고르면 머리 위에 이모지가 2.5초 뜸. 방장이 상태(em)로 모두에게 전달, 친구는 act{a:e,i}. AI는 맞아서 외야로 나가면 울기.

■ 모드
- 로비의 "모드" 버튼으로 일반 피구/왕 피구 선택(gmode 0/1). 새 모드는 GMODES에 추가하고 reset(), out()의 승패 판정, kingUI()를 참고.
- 왕 피구: reset()에서 팀마다 한 명을 왕으로 뽑음(KG[팀]). 왕이 맞아서 아웃되면 그 팀 패배. 왕관(c.kc)은 내 팀 왕에게만 보임. 멀티에서는 방장이 각 친구에게 자기 팀 왕 번호(k)만 보내서 상대 왕은 알 수 없음. 왕관은 커마에서 고를 수 없음.
- 효과음: 승리/패배 효과음은 sfxEnd(win), end()에서 재생.
- 공 2개 피구(gmode 3): 공 상태 B/bm은 let이고 두 번째 공 B2/bm2를 BL=[B,B2], BMS로 selB(k)로 바꿔 끼움. give/drop/shoot/pass는 selB 후 호출(끝나면 selB(0)). B2.st==="off"면 비활성. hk(c)=c가 든 공 번호(없으면 -1). 두 번째 공 종류는 curBall2(공2 버튼).
- 업데이트 내용: UPD 배열 맨 앞에 {v:"3.1",d:"날짜 시간",s:[{h:"소제목",t:["요점",...]},...]}를 추가하면 로비 업데이트 버튼에 새 버전이 맨 위로 나옴.
- 로비 UI: 스크립트 끝에서 카드 3개(cdSt 시작/cdSet 설정/cdMe 내 캐릭터)와 도구줄(.tl)로 재배치함. 방 만들기(openPanel)와 solo 종료(end)에서는 카드를 숨겨야 함.

■ 알려진 한계/할 일 후보
- 작성자가 직접 실행해 보지 못한 채 만든 부분이 많음. 특히 멀티플레이와 외야 이동은 실제 테스트가 필요함.
- 친구 화면 움직임이 조금 끊김(14Hz 보간). 방장이 나가면 전부 끊김.
- 게임 시작 후에는 친구 추가 불가, 방을 만든 뒤에는 인원 변경 불가.
- 점수 기록, 난이도 조절은 미구현.
- 한 줄이 긴 압축된 코드 스타일이라, 이어서 개발하기 전에 포맷을 정리하면 편함.
-->
