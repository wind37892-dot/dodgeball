<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3인칭 피구</title>
<style>
:root{--bg:#10243a;--ink:#f4f7fa;--acc:#ffb703;--panel:rgba(8,20,34,.82);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#081522;--panel:rgba(4,12,22,.86)}}
:root[data-theme="dark"]{--bg:#081522;--panel:rgba(4,12,22,.86)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:"Arial Black",Impact,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
canvas{display:block;position:fixed;inset:0}
#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;justify-content:space-between;padding:12px 16px;font-size:17px;pointer-events:none}
#pad{position:fixed;left:0;bottom:0;width:58%;height:62%}
.b{position:fixed;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px}
.b:active{transform:scale(.94)}
#thr{right:22px;bottom:calc(36px + env(safe-area-inset-bottom,0px));width:96px;height:96px;background:var(--acc);color:#10243a;box-shadow:0 0 0 6px rgba(255,183,3,.28)}
#pss{right:36px;bottom:calc(150px + env(safe-area-inset-bottom,0px));width:70px;height:70px;background:#3a86ff;color:#fff}
#ctc{right:132px;bottom:calc(48px + env(safe-area-inset-bottom,0px));width:64px;height:64px;background:#2ec4b6;color:#10243a}
#vw{right:16px;top:calc(54px + env(safe-area-inset-top,0px));width:56px;height:56px;background:rgba(244,247,250,.9);color:#10243a;font-size:14px}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--panel);text-align:center;padding:24px}
#ov h1{margin:0;font-size:40px;letter-spacing:-1px}
#ov p{margin:0;max-width:32ch;line-height:1.6;font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:16px}
#go{border:0;border-radius:999px;background:var(--acc);color:#10243a;font:inherit;font-size:20px;padding:14px 36px}
#go:focus-visible,.b:focus-visible{outline:3px solid #fff;outline-offset:3px}
#rc{font:inherit;font-size:16px;padding:10px 14px;border-radius:999px;border:2px solid #fff;background:transparent;color:inherit;text-align:center;width:200px}
#lb{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#lb button{border:0;border-radius:999px;background:var(--acc);color:#10243a;font:inherit;font-size:15px;padding:12px 18px}
#ms{min-height:1.4em;color:var(--acc)}
#ov{overflow:auto;justify-content:safe center}
#nw textarea{width:min(320px,86vw);font:12px monospace;border-radius:12px;border:2px solid #fff;background:transparent;color:inherit;padding:8px}
#nw button{border:0;border-radius:999px;background:var(--acc);color:#10243a;font:inherit;font-size:15px;padding:10px 18px}
</style></head><body>
<div id="hud"><span id="hp"></span><span id="rm"></span><span id="en"></span></div>
<div id="pad"></div>
<div id="pss" class="b" role="button" tabindex="0">패스</div>
<div id="ctc" class="b" role="button" tabindex="0">잡기</div>
<div id="vw" class="b" role="button" tabindex="0">시점</div>
<div id="thr" class="b" role="button" tabindex="0">던지기</div>
<div id="ov"><h1>3인칭 피구</h1><p>3 대 3 대결이에요. 공은 하나뿐! 공을 잡으면 던지기로 적을 맞히거나 패스로 팀원에게 넘겨요. 맞은 사람은 상대편 뒤쪽 외야로 나가고, 놓친 공은 외야 팀원이 받아 다시 던져요. 적이 던진 공은 잡기 버튼을 타이밍 맞춰 누르면 받아낼 수 있고, 잡으면 던진 사람이 아웃! 왼쪽 화면을 밀어 이동 (PC: WASD, 스페이스=던지기, E=패스, F=잡기, V=시점 전환). 외야에 나가면 코트 전체가 보이는 넓은 시점으로 바뀌고, 시점 버튼으로 다시 바꿀 수 있어요.</p><input id="rc" maxlength="12" placeholder="방 코드(친구와 같은 코드)" autocomplete="off"><div id="lb"><button id="go">혼자 하기</button><button id="hs">방 만들기</button><button id="js">친구 방 참가</button></div><p id="ms"></p><div id="nw" style="display:none;flex-direction:column;gap:8px;align-items:center"><textarea id="t1" readonly rows="3" placeholder="내 코드"></textarea><button id="cp">코드 복사</button><textarea id="t2" rows="3" placeholder="받은 코드 붙여넣기"></textarea><button id="ok">확인</button><div id="nb" style="display:flex;gap:8px"><button id="mo">친구 추가</button><button id="sb">게임 시작</button></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));document.body.prepend(R.domElement);
const S=new THREE.Scene();S.background=new THREE.Color(0x10243a);S.fog=new THREE.Fog(0x10243a,20,42);
const C=new THREE.PerspectiveCamera(62,1,.1,80);
function fit(){R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()}
addEventListener("resize",fit);fit();
S.add(new THREE.HemisphereLight(0xffffff,0x20405a,.9));
const dl=new THREE.DirectionalLight(0xffffff,.7);dl.position.set(4,10,6);S.add(dl);
const M=c=>new THREE.MeshLambertMaterial({color:c});
const flat=(w,d,x,z,c,y)=>{const l=new THREE.Mesh(new THREE.PlaneGeometry(w,d),M(c));l.rotation.x=-Math.PI/2;l.position.set(x,y,z);S.add(l)};
flat(16,30,0,0,0x17405a,-.02);flat(12,20,0,0,0x2f7f86,0);
flat(12,.12,0,0,0xffffff,.01);flat(12,.12,0,10,0xffffff,.01);flat(12,.12,0,-10,0xffffff,.01);flat(.12,20,6,0,0xffffff,.01);flat(.12,20,-6,0,0xffffff,.01);
function mk(c){const g=new THREE.Group();const b=new THREE.Mesh(new THREE.CylinderGeometry(.4,.45,1.2,12),M(c));b.position.y=.6;const h=new THREE.Mesh(new THREE.SphereGeometry(.3,12,12),M(0xffe0bd));h.position.y=1.5;g.add(b,h);S.add(g);return g}
const ring=new THREE.Mesh(new THREE.RingGeometry(.55,.72,24),new THREE.MeshBasicMaterial({color:0xffd166,side:2}));ring.rotation.x=-Math.PI/2;S.add(ring);
const bm=new THREE.Mesh(new THREE.SphereGeometry(.24,14,14),M(0xffd166));S.add(bm);bm.add(new THREE.Mesh(new THREE.TorusGeometry(.245,.035,6,24),M(0xc2410c)));
const B={st:"held",h:null,v:new THREE.Vector3(),rv:new THREE.Vector3(),kind:"",team:0,tgt:null,t:0};
let T=[],P,run=false,fl=0,wide=0,net={mode:"solo",slots:{},g:0};
const inn=t=>T.filter(c=>c.team===t&&!c.out);
const near=(v,a)=>{let n=a[0],d=1e9;a.forEach(c=>{const k=c.m.position.distanceTo(v);if(k<d){d=k;n=c}});return n};
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
function give(c){B.st="held";B.h=c;c.cd=.9+Math.random()}
function drop(){const q=bm.position;let x=cl(q.x,-5.5,5.5),z=q.z;
if(z<-10.2){const o=T.find(c=>c.team===0&&c.out);if(o)return give(o);z=-9.4}
else if(z>10.2){const o=T.find(c=>c.team===1&&c.out);if(o)return give(o);z=9.4}
B.rv.copy(B.v).multiplyScalar(.5);B.rv.y=0;B.st="loose";B.h=null;bm.position.set(x,.24,cl(z,-9.4,9.4))}
function shoot(c,t,sp,j){const p=c.m.position,q=t.m.position,tm=p.distanceTo(q)/sp;
B.st="fly";B.kind="t";B.thr=c;B.team=c.team;B.h=null;B.t=0;bm.position.set(p.x,1.1,p.z);
B.v.set(q.x+(t.vx||0)*tm*.7+(Math.random()-.5)*j-p.x,0,q.z+(t.vz||0)*tm*.7-p.z).normalize().multiplyScalar(sp)}
function pass(c,m){const p=c.m.position;B.st="fly";B.kind="p";B.team=c.team;B.tgt=m;B.h=null;B.t=0;bm.position.set(p.x,1.1,p.z)}
function out(c){c.out=1;if(c===P)wide=1;const p=c.m.position;p.z=c.team?12:-12;p.x=cl(p.x,-5,5);c.tz=p.z;
if(!inn(1).length)end(true);else if(!inn(0).length)end(false)}
function reset(){T.forEach(c=>S.remove(c.m));T=[];
const add=(team,x,z,pl)=>{const m=mk(pl?0x00c2ff:team?0xef476f:0x3a86ff);m.position.set(x,0,z);const c={m,team,out:0,pl,cd:1,tx:x,tz:z,wt:0,vx:0,vz:0,cw:0,cc:0,seen:0,rx:0,rz:0};T.push(c);return c};
P=add(0,0,7,1);P.cw=0;P.cc=0;add(0,-3.5,6,0);add(0,3.5,6,0);add(1,-3,-6,0);add(1,0,-6,0);add(1,3,-6,0);
for(const k in net.slots){const c=T[net.slots[k]];c.pl=1;c.seen=performance.now()}give(P);fl=0;wide=0}
function doThrow(){if(!run)return;if(net.mode==="guest")return act("t");if(B.st!=="held"||B.h!==P)return;const e=inn(1);if(e.length)shoot(P,near(P.m.position,e),18,0)}
function doPass(){if(!run)return;if(net.mode==="guest")return act("p");if(B.st!=="held"||B.h!==P)return;let m=inn(0).filter(c=>c!==P);if(!m.length)m=T.filter(c=>c.team===0&&c.out&&c!==P);if(m.length)pass(P,near(P.m.position,m))}
function doCatch(){if(!run)return;if(net.mode==="guest")return act("c");if(!P.out&&P.cc<=0){P.cw=.45;P.cc=1.2}}
const K={};addEventListener("keydown",e=>{K[e.code]=1;if(e.code==="Space"){e.preventDefault();doThrow()}if(e.code==="KeyE")doPass();if(e.code==="KeyF")doCatch();if(e.code==="KeyV")wide^=1});addEventListener("keyup",e=>K[e.code]=0);
let jx=0,jz=0,ox=0,oy=0,pid=null;
pad.addEventListener("pointerdown",e=>{pid=e.pointerId;ox=e.clientX;oy=e.clientY;pad.setPointerCapture(pid)});
pad.addEventListener("pointermove",e=>{if(e.pointerId!==pid)return;let x=(e.clientX-ox)/45,z=(e.clientY-oy)/45;const l=Math.hypot(x,z);if(l>1){x/=l;z/=l}jx=x;jz=z});
const up=e=>{if(e.pointerId===pid){pid=null;jx=jz=0}};pad.addEventListener("pointerup",up);pad.addEventListener("pointercancel",up);
thr.addEventListener("pointerdown",e=>{e.preventDefault();doThrow()});pss.addEventListener("pointerdown",e=>{e.preventDefault();doPass()});
thr.addEventListener("keydown",e=>{if(e.key==="Enter")doThrow()});ctc.addEventListener("pointerdown",e=>{e.preventDefault();doCatch()});ctc.addEventListener("keydown",e=>{if(e.key==="Enter")doCatch()});vw.addEventListener("pointerdown",e=>{e.preventDefault();wide^=1});vw.addEventListener("keydown",e=>{if(e.key==="Enter")wide^=1});pss.addEventListener("keydown",e=>{if(e.key==="Enter")doPass()});
function inp(){let x=jx+((K.KeyD||K.ArrowRight)?1:0)-((K.KeyA||K.ArrowLeft)?1:0),z=jz+((K.KeyS||K.ArrowDown)?1:0)-((K.KeyW||K.ArrowUp)?1:0);if(P.out){z=0;if(!wide)x=-x}return[x,z]}
function act(a){net.room&&net.room.emit("act",{tag:net.tag,a})}
function startHost(){net.g++;net.e=0;reset();run=true;ov.style.display="none"}
function bcast(now){if(now-(net.bt||0)<70)return;net.bt=now;const q=bm.position,r=v=>Math.round(v*100)/100;net.room.emit("st",{g:net.g,e:run?0:net.e||0,t:T.map(c=>[r(c.m.position.x),r(c.m.position.z),c.out]),b:[B.st==="held"?0:B.st==="fly"?1:2,B.h?T.indexOf(B.h):-1,r(q.x),r(q.y),r(q.z)]})}
function netApply(d){if(d.g!==net.g){net.g=d.g;net.first=1;run=true;ov.style.display="none"}
d.t.forEach((a,i)=>{const c=T[i],o=c.out;c.out=a[2];c.gx=a[0];c.gz=a[1];if(net.first)c.m.position.set(a[0],0,a[1]);if(!o&&c.out&&c===P)wide=1});
net.first=0;net.b=d.b;B.st=["held","fly","loose"][d.b[0]];B.h=d.b[1]>=0?T[d.b[1]]:null;
if(d.e>0&&run)end(d.e===1)}
function glerp(dt){const k=Math.min(1,dt*14);T.forEach(c=>{if(c.gx===undefined)return;const p=c.m.position;p.x+=(c.gx-p.x)*k;p.z+=(c.gz-p.z)*k});
if(net.b&&B.st!=="held"){const q=bm.position;q.x+=(net.b[2]-q.x)*k;q.y=net.b[3];q.z+=(net.b[4]-q.z)*k}}
const mkcode=()=>(rc.value||"").toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,12);
async function openRoom(c){const u=window.claude&&claude.use?await claude.use("room"):null;if(!u){ms.textContent="멀티는 로그인한 채로 공유 링크에서만 가능해요.";return null}
try{return await u.join("pg"+c)}catch(e){ms.textContent="방에 연결하지 못했어요. 잠시 뒤 다시 해 봐요.";return null}}
go.onclick=()=>{if(net.mode==="host")return startHost();net.mode="solo";reset();run=true;ov.style.display="none"};
hs.onclick=async()=>{if(net.mode==="host")return startHost();
const c=mkcode()||Math.random().toString(36).slice(2,6),r=await openRoom(c);if(!r)return;
net.mode="host";net.room=r;net.slots={};rm.textContent="방 코드 "+c;
r.on("hello",m=>{const t=m.data&&m.data.tag;if(m.isMe||typeof t!=="string")return;let i=net.slots[t];
if(i===undefined){const u=Object.values(net.slots);i=[1,2].find(k=>!u.includes(k));if(i===undefined)return;net.slots[t]=i;T[i].pl=1}
T[i].seen=performance.now();r.emit("assign",{tag:t,slot:i})});
r.on("in",m=>{const d=m.data;if(!d||m.isMe)return;const i=net.slots[d.tag];if(i===undefined)return;const c=T[i];c.pl=1;c.seen=performance.now();c.rx=cl(+d.x||0,-1,1);c.rz=cl(+d.z||0,-1,1)});
r.on("act",m=>{const d=m.data;if(!d||m.isMe||!run)return;const i=net.slots[d.tag];if(i===undefined)return;const c=T[i];c.seen=performance.now();const h=B.st==="held"&&B.h===c;
if(d.a==="t"&&h){const e=inn(1);if(e.length)shoot(c,near(c.m.position,e),18,0)}
else if(d.a==="p"&&h){let q=inn(0).filter(k=>k!==c);if(!q.length)q=T.filter(k=>k.team===0&&k.out&&k!==c);if(q.length)pass(c,near(c.m.position,q))}
else if(d.a==="c"&&!c.out&&c.cc<=0){c.cw=.45;c.cc=1.2}});
startHost()};
js.onclick=async()=>{const c=mkcode();if(!c){ms.textContent="방 코드를 입력해 주세요.";return}
const r=await openRoom(c);if(!r)return;net.mode="guest";net.room=r;net.tag=Math.random().toString(36).slice(2,10);net.slot=undefined;reset();
lb.style.display="none";rc.style.display="none";rm.textContent="방 "+c;ms.textContent="방장을 기다리는 중…";
r.on("assign",m=>{const d=m.data;if(!d||d.tag!==net.tag||net.slot!==undefined)return;net.slot=d.slot;P=T[d.slot];clearInterval(net.hb);ms.textContent="연결됐어요! 방장이 시작하길 기다려요."});
r.on("st",m=>{if(!m.isMe&&net.slot!==undefined&&m.data)netApply(m.data)});
const hi=()=>r.emit("hello",{tag:net.tag});hi();net.hb=setInterval(hi,1500);
setInterval(()=>{if(net.slot===undefined)return;const[x,z]=inp();r.emit("in",{tag:net.tag,x:Math.round(x*100)/100,z:Math.round(z*100)/100})},100)};
function end(win){run=false;net.e=win?1:2;ov.style.display="flex";lb.style.display=net.mode==="guest"?"none":"flex";ms.textContent=net.mode==="guest"?"방장이 다시 시작하면 이어져요.":"";ov.querySelector("h1").textContent=win?"승리!":"패배";ov.querySelector("p").textContent=win?"상대 팀을 모두 외야로 보냈어요.":"우리 팀이 모두 외야로 나갔어요. 다시 도전해 봐요.";go.textContent="다시 하기"}
function ui(){const h=B.st==="held"?B.h:null;hp.textContent=(P.out?"외야 · ":"")+"공: "+(B.st==="fly"?"날아가는 중":B.st==="loose"?"바닥":h===P?"내 손!":h.team?"상대 팀":"우리 팀");en.textContent="우리 "+inn(0).length+" · 적 "+inn(1).length}
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.05);last=now;
if(run&&net.mode!=="guest"){
T.forEach(c=>{const p=c.m.position,ox=p.x,oz=p.z;if(c.pl&&c!==P&&now-c.seen>4000)c.pl=0;
if(c.pl){let[x,z]=c===P?inp():[c.rx||0,c.rz||0];if(c.out)z=0;const l=Math.hypot(x,z);if(l>1){x/=l;z/=l}
p.x=cl(p.x+x*5.5*dt,-5.4,5.4);if(!c.out)p.z=cl(p.z+z*5.5*dt,1,9.4);c.cw-=dt;c.cc-=dt}
else{c.wt-=dt;const q=bm.position;
if(c.wt<=0){c.wt=1+Math.random()*1.2;c.tx=(Math.random()-.5)*10;c.tz=c.out?(c.team?12:-12):(c.team?-1:1)*(1.8+Math.random()*7)}
if(!c.out&&B.st==="loose"&&(c.team?q.z<0:q.z>0)&&near(q,inn(c.team))===c){c.tx=q.x;c.tz=q.z}
const dx=c.tx-p.x,dz=c.tz-p.z,d=Math.hypot(dx,dz);if(d>.05){const s=Math.min(d,3.8*dt);p.x+=dx/d*s;p.z+=dz/d*s}
if(B.st==="held"&&B.h===c){c.cd-=dt;if(c.cd<=0){const e=inn(1-c.team),m=T.filter(k=>k.team===c.team&&k!==c);
if(e.length){if(Math.random()<.25&&m.length)pass(c,m[Math.random()*m.length|0]);else shoot(c,e[Math.random()*e.length|0],c.out?18:c.team?12+Math.random()*2:14,1.2)}c.cd=.9+Math.random()}}}
c.vx=(p.x-ox)/dt;c.vz=(p.z-oz)/dt});
const q=bm.position;
if(B.st==="loose"){q.x+=B.rv.x*dt;q.z+=B.rv.z*dt;B.rv.multiplyScalar(Math.exp(-1.6*dt));if(Math.abs(q.x)>5.6){q.x=Math.sign(q.x)*5.6;B.rv.x*=-.5}if(Math.abs(q.z)>9.5){q.z=Math.sign(q.z)*9.5;B.rv.z*=-.5}bm.rotation.x+=B.rv.z*dt/.24;bm.rotation.z-=B.rv.x*dt/.24;for(const c of inn(q.z>0?0:1)){const p=c.m.position;if(Math.hypot(q.x-p.x,q.z-p.z)<.9){give(c);break}}}
else if(B.st==="fly"){B.t+=dt;
if(B.kind==="p"){const m=B.tgt.m.position,dx=m.x-q.x,dz=m.z-q.z,d=Math.hypot(dx,dz);if(d<.6||B.t>3)give(B.tgt);else{q.x+=dx/d*12*dt;q.z+=dz/d*12*dt}}
else{q.addScaledVector(B.v,dt);let hit=null;inn(1-B.team).forEach(c=>{if(Math.hypot(q.x-c.m.position.x,q.z-c.m.position.z)<.7)hit=c});
if(hit){if(hit.pl?hit.cw>0:Math.random()<.2){const th=B.thr;give(hit);if(th&&!th.out)out(th)}else{if(hit===P)fl=.25;drop();out(hit)}}else if(Math.abs(q.x)>6.2||(B.v.z>0&&q.z>10.2)||(B.v.z<0&&q.z<-10.2)||B.t>3)drop()}}
}
if(net.mode==="host"&&net.room)bcast(now);else if(net.mode==="guest")glerp(dt);
