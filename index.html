<!DOCTYPE html>
<!--
[온라인 피구] 3D 3인칭 피구. 단일 HTML 파일, 모바일(터치) 우선.
외부 스크립트는 three.js r128(cdnjs)과 PeerJS 1.5.4(jsdelivr) 둘뿐이고, 버전을 고정해서 불러옴.

■ 규칙
- 팀 인원 N명(2~5) 대 N명. 시작은 점프볼: 3초 카운트다운 후 공이 올라가고, 꼭대기 근처에서 던지기 버튼을 누를수록 높이 뜀. 더 높이 뛴 쪽이 공을 쳐서 팀원에게 보냄.
- 공은 하나. 가진 사람은 던지기(가장 가까운 적 자동 조준, 이동 예측 포함)나 패스(팀원에게 유도 비행)를 함.
- 던진 공에 맞으면 아웃되어 상대 코트의 뒤와 옆(외야)으로 이동.
- 잡기 버튼: 0.45초 동안 잡기 상태(쿨다운 3초, 버튼에 남은 시간 표시). 이때 던진 공에 맞으면 공만 받고 던진 사람은 그대로. 상대 패스가 근처를 지나가도 가로챔. AI도 던진 공은 20%, 패스는 25% 확률로 받아냄.
- 코트 밖으로 나간 공은 바닥을 굴러감(마찰, 바깥 벽에서 튕김). 나간 쪽 외야가 주워 감. 그쪽 외야가 한 명도 없으면 그 코트의 내야가 가져감.
- 상대 팀 전원 아웃이면 승리, 우리 팀 전원 아웃이면 패배.

■ 좌표/데이터
- 코트: x -6~6, z -10~10, 중앙선 z=0. 팀0(파랑, 우리 팀)은 z>0, 팀1(빨강)은 z<0. 외야는 상대 코트의 뒤(|z|>10)와 옆(|x|>6) 띠(clampOut).
- T = 모든 캐릭터 배열. 인덱스 0..N-1 = 팀0(0번은 방장/내 캐릭터 P, 나머지는 AI 또는 친구), N..2N-1 = 팀1. 점프볼 대표는 T[0]과 T[N+(N>>1)].
- 캐릭터 필드: m(3D 그룹), team, out, pl(사람이 조종하는지), cw/cc(잡기 창/쿨다운), rx/rz(원격 입력), seen(마지막 입력 시각), mk(이름표와 모자).
- B = 공 상태. B.st: held(들고 있음, B.h) / fly(B.kind: t=던짐, p=패스) / loose(굴러감, B.rv) / jump(점프볼 중). 공 메시는 bm.
- J = 점프볼 상태(카운트다운 cd, 경과 t, 누른 시각 tb/tr, 결과 문구 res).
- 카메라: yaw(오른쪽 화면 드래그 또는 ←/→ 키로 회전), zoom(확대/축소: 우측 상단 ＋/－ 버튼, 오른쪽 화면 핀치, 마우스 휠, +/- 키), wide(넓은 시점, 버튼을 없애서 항상 0). 이동 입력은 카메라 기준(inp()).

■ 멀티플레이(방장 권한 방식)
- 방장 기기가 시뮬레이션을 전부 계산. 친구는 입력만 보내고 상태를 받아 그림. 친구는 방장 팀의 AI 자리(인덱스 1..N-1) 또는 상대 팀 자리(N..2N-1)를 골라 맡음(참가 시 metadata.team). 상대 팀 점프볼 대표도 사람이 될 수 있음.
- PeerJS 무료 공개 서버로 방 코드(피어 ID는 pgdodge-코드)를 찾은 뒤 WebRTC로 직접 연결(serialization json).
- 방장 to 친구: assign{slot}, full, st{g(게임 번호), s(인원), nm(닉네임 맵), j(최고 높이 표시), n(카운트다운), e(종료 0/1/2), t[[x,z,out,y,잡기중]...], b[공상태코드, 들고있는사람, x,y,z]} 약 14Hz.
- 친구 to 방장: in{x,z}(10Hz, 세계 좌표 이동 벡터), act{a: t(던지기/점프) 또는 p(패스) 또는 c(잡기)}, nick{n}.
- 친구 화면은 시뮬레이션 없이 보간만 함(glerp). 4초 동안 입력이 없으면 그 자리는 AI로 복귀.

■ 코드 지도(위에서 아래로)
렌더러/씬 → 캐릭터/공 → 게임 로직(give, drop, shoot, pass, out, reset) → 입력(doThrow/doPass/doCatch, 조이스틱, 카메라 드래그) → 점프볼(startJump, jumpStep) → 네트워크(bcast, netApply, glerp, hostMsg, hostWatch, hs/js.onclick) → end/ui/loop(매 프레임 시뮬레이션과 카메라) → 로비 UI 생성 → 이름표(mark), 최고 높이 표시(apx).

■ 추가된 것
- 조이스틱: #pad를 누른 자리에 #jb(바닥)/#jk(손잡이)가 뜸. 손을 떼면 왼쪽 아래 기본 위치로 복귀.
- 가로모드: CSS orientation:landscape 배치 + 로비의 "가로 모드" 버튼(전체화면+방향 잠금, 미지원 기기는 안내만).
- 패스: 공을 들면 #pcs에 팀원 원이 뜸(파랑=내야, 주황=외야, 바라보는 방향 기준 왼쪽→오른쪽). 시선에 가장 가까운 팀원이 하얀 링으로 강조되고 패스 버튼/E는 그 사람에게, 원을 누르면 그 사람에게 패스. 친구는 act{a:p, i:대상 인덱스}로 보냄.
- 외야 AI 길찾기: way()가 코트 안쪽(통과 불가 구역)을 모서리 경유로 돌아가서 clampOut에 막혀 멈추던 버그 수정.

- 조준 던지기: 자동 조준 없음. 던지기는 카메라가 보는 방향(lookA)으로 직선 발사(shootDir). 공을 들면 #ag(빨간 조준선)가 바닥에 표시됨. 친구는 act{a:t,y:시선각}으로 보냄.
- 로비로 돌아가기(#lob): 멀티(방장/친구) 종료 화면과 연결 끊김 화면에 표시. 방을 닫거나 나가고 새로고침.
- 점프볼: 점프 높이 = 누른 순간 공 높이까지(공 높이-1.7). 더 높은 쪽이 승리, 안 누르면 패배.

- 감정표현: #em 버튼 → #emp 패널(EM 목록). 고르면 머리 위에 이모지가 2.5초 뜸. 방장이 상태(em)로 모두에게 전달, 친구는 act{a:e,i}. AI는 맞아서 외야로 나가면 울기.

■ 알려진 한계/할 일 후보
- 작성자가 직접 실행해 보지 못한 채 만든 부분이 많음. 특히 멀티플레이와 외야 이동은 실제 테스트가 필요함.
- 친구 화면 움직임이 조금 끊김(14Hz 보간). 방장이 나가면 전부 끊김.
- 게임 시작 후에는 친구 추가 불가, 방을 만든 뒤에는 인원 변경 불가.
- 점수 기록, 난이도 조절, 효과음은 미구현.
- 한 줄이 긴 압축된 코드 스타일이라, 이어서 개발하기 전에 포맷을 정리하면 편함.
-->
<html lang="ko"><head><meta charset="utf-8">

</style></head><body>

<div id="ov" class="ld"><h1>온라인 피구</h1><p>인원을 정하고 시작해요.</p><input id="rc" maxlength="12" placeholder="방 코드(호스트가 알려준 코드)" autocomplete="off"><div id="lb"><button id="go">혼자 하기</button><button id="hs">방 만들기</button><button id="js">친구 방 참가</button><button id="lsb">가로 모드</button></div><p id="ms"></p><button id="lob" style="display:none">로비로 돌아가기</button><div id="nw" style="display:none;flex-direction:column;gap:8px;align-items:center"><div id="nb" style="display:flex;gap:8px"><button id="sb">게임 시작</button></div></div></div>

<script>
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));document.body.prepend(R.domElement);
const S=new THREE.Scene();S.background=new THREE.Color(0x10243a);S.fog=new THREE.Fog(0x10243a,20,42);
const C=new THREE.PerspectiveCamera(62,1,.1,80);
function fit(){R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.fov=C.aspect>1?55:62;C.updateProjectionMatrix()}
addEventListener("resize",fit);fit();
S.add(new THREE.HemisphereLight(0xffffff,0x20405a,.9));
const dl=new THREE.DirectionalLight(0xffffff,.7);dl.position.set(4,10,6);S.add(dl);
const M=c=>new THREE.MeshLambertMaterial({color:c});
const flat=(w,d,x,z,c,y)=>{const l=new THREE.Mesh(new THREE.PlaneGeometry(w,d),M(c));l.rotation.x=-Math.PI/2;l.position.set(x,y,z);S.add(l)};
flat(22,32,0,0,0x17405a,-.02);flat(12,20,0,0,0x2f7f86,0);
flat(12,.12,0,0,0xffffff,.01);flat(12,.12,0,10,0xffffff,.01);flat(12,.12,0,-10,0xffffff,.01);flat(.12,20,6,0,0xffffff,.01);flat(.12,20,-6,0,0xffffff,.01);
function mk(c){const g=new THREE.Group();const b=new THREE.Mesh(new THREE.CylinderGeometry(.4,.45,1.2,12),M(c));b.position.y=.6;const h=new THREE.Mesh(new THREE.SphereGeometry(.3,12,12),M(0xffe0bd));h.position.y=1.5;g.add(b,h);S.add(g);return g}
const ring=new THREE.Mesh(new THREE.RingGeometry(.55,.72,24),new THREE.MeshBasicMaterial({color:0xffd166,side:2}));ring.rotation.x=-Math.PI/2;S.add(ring);
const bm=new THREE.Mesh(new THREE.SphereGeometry(.24,14,14),M(0xffd166));S.add(bm);bm.add(new THREE.Mesh(new THREE.TorusGeometry(.245,.035,6,24),M(0xc2410c)));
const B={st:"held",h:null,v:new THREE.Vector3(),rv:new THREE.Vector3(),kind:"",team:0,tgt:null,t:0};
let T=[],P,run=false,fl=0,wide=0,yaw=0,zoom=1,N=3,J={on:0,until:0},net={mode:"solo",slots:{},g:0};
const inn=t=>T.filter(c=>c.team===t&&!c.out);
const near=(v,a)=>{let n=a[0],d=1e9;a.forEach(c=>{const k=c.m.position.distanceTo(v);if(k<d){d=k;n=c}});return n};
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
